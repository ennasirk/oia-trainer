<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0032A0">
<title>OIA Trainer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230032A0'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3EOIA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --gvsu-blue:#0032A0; --midnight:#13155C; --black:#000; --white:#fff;
  --correct-bg:#D8F6F5; --wrong-bg:#F1E2DB; --wrong-border:#BA6F4C; --missed-bg:#F8F3EA;
  --track:#CCD6EC; --muted:#4a4a5a; --line:#d5d9e4; --soft:#f4f6fb;
  --radius:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--black);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45}
button,input,select{font:inherit}
button{touch-action:manipulation}
a{color:var(--gvsu-blue)}
:focus-visible{outline:3px solid var(--gvsu-blue);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}
.wrap.wide{max-width:1150px}
.topbar{position:sticky;top:0;z-index:5;background:var(--gvsu-blue);color:var(--white);padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;align-items:center;gap:8px}
.topbar .inner{max-width:480px;width:100%;margin:0 auto;display:flex;align-items:center;gap:8px}
.topbar.wide .inner{max-width:1150px}
.topbar .title{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;color:var(--white);min-width:44px;min-height:44px;border-radius:8px;font-size:22px;cursor:pointer;padding:0 8px}
.textbtn{background:transparent;border:2px solid rgba(255,255,255,.85);color:var(--white);min-height:44px;border-radius:8px;padding:0 14px;font-weight:600;cursor:pointer}
.badge{background:var(--midnight);color:var(--white);border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700;white-space:nowrap}
h1{color:var(--midnight);font-size:30px;margin:28px 0 4px;line-height:1.15}
h2{color:var(--midnight);font-size:21px;margin:24px 0 8px}
h3{color:var(--midnight);font-size:17px;margin:16px 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.seg{display:flex;border:2px solid var(--gvsu-blue);border-radius:var(--radius);overflow:hidden}
.seg button{flex:1;min-height:48px;border:0;background:var(--white);color:var(--gvsu-blue);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gvsu-blue);color:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--gvsu-blue);background:var(--white);color:var(--gvsu-blue);font-weight:600;cursor:pointer;text-transform:capitalize}
.chip[aria-pressed="true"]{background:var(--gvsu-blue);color:var(--white)}
.levelline{color:var(--midnight);font-weight:600;margin:10px 0 20px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:var(--radius);border:2px solid var(--gvsu-blue);background:var(--white);color:var(--gvsu-blue);font-weight:700;font-size:18px;cursor:pointer;margin:10px 0;text-decoration:none;padding:0 16px;text-align:center}
.btn.primary{background:var(--gvsu-blue);color:var(--white)}
.btn:disabled{background:#e9ebf1;border-color:#9aa0b0;color:#4d5263;cursor:not-allowed}
.footer{margin-top:28px;color:var(--muted);font-size:15px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.notice{background:var(--soft);border-left:4px solid var(--gvsu-blue);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:15px}
.prompt{font-size:20px;line-height:1.35;margin:22px 0 6px;color:var(--black)}
.prompt strong{color:var(--midnight)}
.hint{color:var(--muted);font-size:15px;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 14px;border:2px solid var(--line);border-radius:var(--radius);background:var(--white);color:var(--black);text-align:left;cursor:pointer;font-size:17px}
.opt:hover{border-color:var(--gvsu-blue)}
.opt input{width:24px;height:24px;flex:none;accent-color:var(--gvsu-blue);margin:0}
.opt.sel{border-color:var(--gvsu-blue);background:#eef2fa}
.opt .txt{flex:1}
.opt .mark{flex:none;font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px}
.opt.is-correct{background:var(--correct-bg);border-color:var(--gvsu-blue);color:var(--midnight)}
.opt.is-wrong{background:var(--wrong-bg);border-color:var(--wrong-border)}
.opt.is-missed{background:var(--missed-bg);border:2px dashed var(--midnight)}
.opt.is-dim{opacity:.72}
.opt[disabled]{cursor:default}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius);font-weight:700;font-size:19px;margin:16px 0 4px}
.banner.ok{background:var(--correct-bg);border:2px solid var(--gvsu-blue);color:var(--midnight)}
.banner.no{background:var(--wrong-bg);border:2px solid var(--wrong-border);color:var(--black)}
.encourage{font-weight:500;font-size:16px}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safe-b));z-index:6}
.sticky .btn{max-width:448px;margin:0 auto}
.card{border:2px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:14px 0;background:var(--white)}
.card h3{margin:0 0 6px;font-size:20px}
.card dl{margin:0}
.card dt{font-weight:700;color:var(--midnight);margin-top:10px;font-size:15px;text-transform:uppercase;letter-spacing:.03em}
.card dd{margin:2px 0 0}
.card .note{background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:15px}
.meta{color:var(--muted);font-size:15px}
details.mcard{border:2px solid var(--line);border-radius:var(--radius);margin:10px 0}
details.mcard summary{min-height:48px;padding:12px 14px;cursor:pointer;font-weight:700;color:var(--midnight)}
details.mcard .card{border:0;margin:0;padding-top:0}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--midnight);color:var(--white);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;transition:opacity .4s}
.toast.hide{opacity:0}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.stat b{color:var(--midnight)}
.list a{display:block;padding:10px 0;min-height:44px;border-bottom:1px solid var(--line);font-weight:600}
.bar{height:12px;background:var(--track);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--gvsu-blue)}
.prow{display:block;width:100%;text-align:left;background:var(--white);border:0;border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer;color:var(--black)}
.prow .top{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px;text-transform:capitalize}
.region{border:2px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:12px 0}
.flip{min-height:300px;border:2px solid var(--gvsu-blue);border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;background:var(--white);width:100%;text-align:left;color:var(--black);transition:transform .25s}
.flip.front{align-items:center;text-align:center}
.flip .big{font-size:28px;font-weight:800;color:var(--midnight);line-height:1.2}
.flip .card{border:0;padding:0;margin:0}
.navrow{display:flex;gap:10px;align-items:center;margin-top:12px}
.navrow .btn{margin:0;flex:1}
.navrow .count{min-width:72px;text-align:center;font-weight:700;color:var(--midnight)}
.search{width:100%;min-height:48px;border:2px solid var(--line);border-radius:var(--radius);padding:0 14px}
.results button{display:block;width:100%;text-align:left;min-height:44px;border:0;border-bottom:1px solid var(--line);background:var(--white);padding:8px 4px;cursor:pointer;color:var(--black)}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--gvsu-blue)}
.confirm{border:2px solid var(--wrong-border);background:var(--wrong-bg);border-radius:var(--radius);padding:12px 14px}
.confirm .row{display:flex;gap:10px}
.confirm .row .btn{margin:8px 0 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);color:var(--midnight);position:sticky;top:0}
td.low{background:var(--wrong-bg)}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line)}
.rv-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.rv-controls select,.rv-controls input[type=text]{min-height:40px;border:2px solid var(--line);border-radius:8px;padding:0 10px}
.small{font-size:14px}
.preview{border:2px dashed var(--gvsu-blue);border-radius:var(--radius);padding:10px 14px;margin:10px 0;background:var(--white)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
"use strict";
/* ================= CONFIG ================= */

/* ================= HELPERS ================= */
const norm = s => String(s == null ? "" : s).toLowerCase().replace(/\s+/g, " ").trim();
const splitList = s => String(s || "").split(";").map(x => x.trim()).filter(Boolean);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => { s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); };
const rand = Math.random;
function shuffle(a, r = rand) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sample(a, n, r = rand) { return shuffle(a, r).slice(0, n); }
function pick(a, r = rand) { return a[Math.floor(r() * a.length)]; }

/* ================= STORAGE ================= */
const store = (() => {
  let ok = true, mem = {};
  try { const k = "__oia_test"; localStorage.setItem(k, "1"); localStorage.removeItem(k); } catch (e) { ok = false; }
  return {
    available: () => ok,
    get(k) { try { return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return mem[k] ?? null; } },
    set(k, v) { try { if (ok) localStorage.setItem(k, v); else mem[k] = v; } catch (e) { mem[k] = v; } },
    remove(k) { try { if (ok) localStorage.removeItem(k); delete mem[k]; } catch (e) { delete mem[k]; } }
  };
})();

/* ================= CSV ================= */
function parseCSV(text) {
  text = String(text).replace(/^﻿/, "");
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(field); rows.push(row); row = []; field = ""; }
    else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}
function parseSite(p) {
  const i = p.indexOf(":");
  return i >= 0 ? { label: p.slice(0, i).trim(), name: p.slice(i + 1).trim() } : { label: null, name: p.trim() };
}
function parseMuscleCsv(text) {
  const rows = parseCSV(text);
  const warnings = [], muscles = [];
  if (!rows.length) return { muscles, warnings: [{ row: 0, muscleId: null, message: "File is empty" }], dataVersion: null };
  const head = rows[0].map(norm);
  const col = name => head.indexOf(name);
  const get = (r, name) => { const i = col(name); return i >= 0 && r[i] != null ? String(r[i]).trim() : ""; };
  const seen = new Set();
  let dataVersion = null;
  const terms = new Set(CONFIG.LOCATION_TERMS);
  rows.slice(1).forEach((r, idx) => {
    const rowNum = idx + 2;
    if (idx === 0) dataVersion = get(r, "data_version") || null;
    const id = get(r, "muscle_id");
    if (norm(get(r, "include")) === "no") return;
    const warn = m => warnings.push({ row: rowNum, muscleId: id || null, message: m });
    const origin = get(r, "origin"), insertion = get(r, "insertion");
    const required = ["muscle_id","muscle","region","location","location_ref","origin","insertion","actions"];
    const missing = required.filter(f => !get(r, f));
    if (missing.length) { warn("Skipped: missing " + missing.join(", ")); return; }
    const region = norm(get(r, "region"));
    if (region !== "upper" && region !== "lower") { warn('Skipped: region must be "upper" or "lower" (found "' + get(r, "region") + '")'); return; }
    const location = norm(get(r, "location"));
    if (!terms.has(location)) { warn('Skipped: location "' + get(r, "location") + '" is not in the location terms list'); return; }
    const oNA = norm(origin) === "na", iNA = norm(insertion) === "na";
    if (oNA !== iNA) { warn("Skipped: origin and insertion must both be NA or both be filled in"); return; }

    if (tested && (!ob.length || !ib.length)) { warn("Skipped: missing origin_bones or insertion_bones"); return; }
    if (seen.has(norm(id))) { warn('Skipped: duplicate muscle_id "' + id + '"'); return; }
    const actions = [];
    splitList(get(r, "actions")).forEach(p => {
      const i = p.indexOf(":");
      if (i < 0) { warn('Action "' + p + '" has no "joint:" part and was skipped'); return; }
      const joint = p.slice(0, i).trim(), action = p.slice(i + 1).trim();
      if (!joint || !action) { warn('Action "' + p + '" is incomplete and was skipped'); return; }
      actions.push({ joint, action, key: norm(joint) + ": " + norm(action) });
    });
    if (!actions.length) { warn("Skipped: no valid actions"); return; }
    let adj = get(r, "difficulty_adjust");
    let difficultyAdjust = 0;
    if (adj !== "") { const n = Number(adj); if (n === -1 || n === 0 || n === 1) difficultyAdjust = n; else warn('difficulty_adjust "' + adj + '" must be -1, 0, or 1; using 0'); }
    seen.add(norm(id));
    muscles.push({
      id: norm(id).replace(/\s+/g, "_"), name: get(r, "muscle"), region, location,
      locationRef: get(r, "location_ref"),
      jointsCrossed: splitList(get(r, "joints_crossed")),
      attachmentsTested: tested,
      originRaw: origin, originSites: tested ? splitList(origin).map(parseSite) : [], originBones: tested ? ob : [],
      insertionRaw: insertion, insertionSites: tested ? splitList(insertion).map(parseSite) : [], insertionBones: tested ? ib : [],
      actions, cardNote: get(r, "card_note") || null, difficultyAdjust
    });
  });
  return { muscles, warnings, dataVersion };
}

/* ================= DATA LOADING ================= */
async function loadData() {
  const embedded = document.getElementById("muscle-data").textContent;
  const tryParse = (text, source) => { const d = parseMuscleCsv(text); return d.muscles.length ? { data: d, source } : null; };
  if (CONFIG.DATA_URL) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), CONFIG.FETCH_TIMEOUT_MS);
      const res = await fetch(CONFIG.DATA_URL, { signal: ctl.signal, cache: "no-store" });
      clearTimeout(t);
      if (res.ok) {
        const text = await res.text(); const got = tryParse(text, "sheet");
        if (got) { store.set(CONFIG.DATA_CACHE_KEY, JSON.stringify({ text, at: Date.now() })); return got; }
      }
    } catch (e) { /* fall through */ }
    try { const c = JSON.parse(store.get(CONFIG.DATA_CACHE_KEY) || "null"); if (c && c.text) { const got = tryParse(c.text, "cache"); if (got) return got; } } catch (e) {}
  }
  const got = tryParse(embedded, "bundled");
  if (got) return got;
  throw new Error("No muscle data could be loaded");
}

/* ================= INDEX (derived data) ================= */
function buildIndex(muscles) {
  const ix = { muscles, byId: {}, pairs: new Map(), sites: new Map(), bones: new Map(), cross: new Map(), actionJointRegion: {}, crossRegion: {}, regionJoints: { upper: [], lower: [] } };
  const regCount = (obj, key, region) => { obj[key] = obj[key] || { upper: 0, lower: 0 }; obj[key][region]++; };
  const ajc = {}, cc = {};
  muscles.forEach(m => {
    ix.byId[m.id] = m;
    m.originBoneKeys = new Set(m.originBones.map(norm));
    m.insertionBoneKeys = new Set(m.insertionBones.map(norm));
    m.boneKeys = new Set([...m.originBoneKeys, ...m.insertionBoneKeys]);
    m.siteKeys = new Set([...m.originSites, ...m.insertionSites].map(s => norm(s.name)));
    m.pairKeys = new Set(m.actions.map(a => a.key));
    m.actionJointKeys = new Set(m.actions.map(a => norm(a.joint)));
    m.crossKeys = new Set(m.jointsCrossed.map(norm));
    m.actions.forEach(a => {
      if (!ix.pairs.has(a.key)) ix.pairs.set(a.key, { key: a.key, joint: norm(a.joint), jointDisplay: a.joint, action: a.action, muscles: new Set() });
      ix.pairs.get(a.key).muscles.add(m.id);
      regCount(ajc, norm(a.joint), m.region);
    });
    if (m.attachmentsTested) {
      [...m.originSites, ...m.insertionSites].forEach(s => {
        const k = norm(s.name);
        if (!ix.sites.has(k)) ix.sites.set(k, { key: k, display: s.name, muscles: new Set() });
        ix.sites.get(k).muscles.add(m.id);
      });
      [...m.originBones, ...m.insertionBones].forEach(b => {
        const k = norm(b);
        if (!ix.bones.has(k)) ix.bones.set(k, { key: k, display: b, muscles: new Set() });
        ix.bones.get(k).muscles.add(m.id);
      });
    }
    m.jointsCrossed.forEach(j => {
      const k = norm(j);
      if (!ix.cross.has(k)) ix.cross.set(k, { key: k, display: j, muscles: new Set() });
      ix.cross.get(k).muscles.add(m.id);
      regCount(cc, k, m.region);
      if (!ix.regionJoints[m.region].includes(k)) ix.regionJoints[m.region].push(k);
    });
  });
  const maj = c => (c.lower > c.upper ? "lower" : "upper");
  Object.keys(ajc).forEach(k => ix.actionJointRegion[k] = maj(ajc[k]));
  Object.keys(cc).forEach(k => ix.crossRegion[k] = maj(cc[k]));
  return ix;
}

/* ================= GENERATOR ================= */
const LOC_COMP = {anterior:["A"],posterior:["P"],medial:["M"],lateral:["L"],superior:["S"],inferior:["I"],anteromedial:["A","M"],anterolateral:["A","L"],posteromedial:["P","M"],posterolateral:["P","L"],superomedial:["S","M"],superolateral:["S","L"],inferomedial:["I","M"],inferolateral:["I","L"],anterosuperior:["A","S"],anteroinferior:["A","I"],posterosuperior:["P","S"],posteroinferior:["P","I"]};
const OPP = {A:"P",P:"A",M:"L",L:"M",S:"I",I:"S"};
function locLevel(answer, term) {
  const a = LOC_COMP[answer] || [], t = LOC_COMP[term] || [];
  const shared = t.filter(x => a.includes(x)).length;
  if (shared >= 1) return "high";
  if (t.some(x => a.includes(OPP[x]))) return "low";
  return "medium";
}
function inScope(m, scope) {
  if (m.region !== scope.region) return false;
  if (!scope.joints || !scope.joints.length) return true;
  return scope.joints.some(j => m.crossKeys.has(j));
}
const LEVELS = ["low", "medium", "high"];
const EASIER = { high: ["medium", "low"], medium: ["low"], low: [] };

function makeVariants(base, ix, skipped) {
  // base: {type, subjectKey, subjectLabel, correct:[keys], display:(k)=>text, cands:{low,medium,high}, multi, related, preferCorrect?}
  const correctCount = base.correct.length;
  const shownCorrect = base.multi ? Math.min(correctCount, 4) : 1;
  const need = base.multi ? Math.max(2, 5 - shownCorrect) : 3;
  const out = new Map();
  for (const L of LEVELS) {
    const plan = []; let left = need;
    for (const lv of [L, ...EASIER[L]]) {
      const pool = base.cands[lv]; const take = Math.min(left, pool.length);
      if (take > 0) plan.push({ level: lv, take, pool }); left -= take;
      if (!left) break;
    }
    if (left > 0) continue;
    // majority level, ties go to easier

    let actual = plan[0].level, best = -1;
    plan.forEach(p => { if (p.take > best || (p.take === best && order[p.level] < order[actual])) { best = p.take; actual = p.level; } });

    const v = {
      variantId: baseId + ":" + actual, baseId, type: base.type, subjectKey: base.subjectKey, subjectLabel: base.subjectLabel,
      subjectMuscleId: base.subjectMuscleId || null, refLabel: base.refLabel || null,
      actualSimilarity: actual, correct: base.correct, plan: plan.map(p => ({ level: p.level, take: p.take, pool: p.pool })),
      display: base.display, multi: base.multi, correctCount, shownCorrectCount: shownCorrect,
      relatedMuscleIds: base.related, preferCorrect: base.preferCorrect || null
    };

    v.tier = v.score.tier;
    out.set(actual, v);

  return [...out.values()];
}
function classify(keys, fn) {
  const c = { low: [], medium: [], high: [] };
  keys.forEach(k => c[fn(k)].push(k));

}
const genCache = new Map();
function generateVariants(ix, scope) {
  const key = scope.region + "|" + (scope.joints && scope.joints.length ? scope.joints.slice().sort().join(",") : "all");

        tested.forEach(o => { const k = norm(o[field]); if (k === correctKey) return; if (!owners.has(k)) owners.set(k, { display: o[field], ms: [] }); owners.get(k).ms.push(o); });

      // T3
      const allBones = [...ix.bones.keys()];
      const cands3 = classify(allBones.filter(b => !m.boneKeys.has(b)), b => {
        const ms = [...ix.bones.get(b).muscles].map(id => ix.byId[id]);
        if (ms.some(o => [...o.crossKeys].some(j => m.crossKeys.has(j)))) return "high";
        if (ms.some(o => o.region === m.region)) return "medium";
        return "low";
      });
      add({ type: "T3", subjectKey: m.id, subjectLabel: m.name, subjectMuscleId: m.id, correct: [...m.boneKeys], display: k => ix.bones.get(k).display, cands: cands3, multi: true, related: [m.id] });
    }
    // T4
    const cands4 = classify(CONFIG.LOCATION_TERMS.filter(t => t !== m.location), t => locLevel(m.location, t));
    add({ type: "T4", subjectKey: m.id, subjectLabel: m.name, subjectMuscleId: m.id, refLabel: m.locationRef, correct: [m.location], display: k => k, cands: cands4, multi: false, related: [m.id] });
    // T5
    const cands5 = classify([...ix.pairs.keys()].filter(p => !m.pairKeys.has(p)), p => {
      const pr = ix.pairs.get(p);
      if (m.actionJointKeys.has(pr.joint)) return "high";
      if (ix.actionJointRegion[pr.joint] === m.region) return "medium";
      return "low";
    });
    add({ type: "T5", subjectKey: m.id, subjectLabel: m.name, subjectMuscleId: m.id, correct: [...m.pairKeys], display: k => { const p = ix.pairs.get(k); return cap(p.jointDisplay) + ": " + p.action; }, cands: cands5, multi: true, related: [m.id] });
    // T9
    if (m.crossKeys.size) {
      const cands9 = classify([...ix.cross.keys()].filter(j => !m.crossKeys.has(j)), j => {
        const ms = [...ix.cross.get(j).muscles].map(id => ix.byId[id]);
        if (ms.some(o => [...o.crossKeys].some(x => m.crossKeys.has(x)))) return "high";
        if (ix.crossRegion[j] === m.region) return "medium";
        return "low";
      });
      add({ type: "T9", subjectKey: m.id, subjectLabel: m.name, subjectMuscleId: m.id, correct: [...m.crossKeys], display: k => cap(ix.cross.get(k).display), cands: cands9, multi: true, related: [m.id] });
    }
  });
  // T6
  const excluded = new Set(CONFIG.T6_EXCLUDED_JOINTS.map(norm));
  const pairSubjects = new Set();
  scoped.forEach(m => m.pairKeys.forEach(p => { if (!excluded.has(ix.pairs.get(p).joint)) pairSubjects.add(p); }));
  pairSubjects.forEach(p => {
    const pr = ix.pairs.get(p);
    const correct = [...pr.muscles];
    const reg = ix.actionJointRegion[pr.joint];
    const cands = classify(M.filter(o => !pr.muscles.has(o.id)).map(o => o.id), id => {
      const o = ix.byId[id];
      if (o.actionJointKeys.has(pr.joint)) return "high";
      if (o.region === reg) return "medium";
      return "low";
    });
    add({ type: "T6", subjectKey: p, subjectLabel: pr.jointDisplay + " " + pr.action, correct, display: muscleName, cands, multi: true, related: correct, preferCorrect: scopedIds });
  });
  // T7
  const siteSubjects = new Set(); scoped.forEach(m => m.siteKeys.forEach(s => siteSubjects.add(s)));
  siteSubjects.forEach(s => {
    const site = ix.sites.get(s); if (!site) return;
    const correct = [...site.muscles]; const cm = correct.map(id => ix.byId[id]);
    const cands = classify(tested.filter(o => !site.muscles.has(o.id)).map(o => o.id), id => {
      const o = ix.byId[id];
      if (cm.some(c => [...c.boneKeys].some(b => o.boneKeys.has(b)))) return "high";
      if (o.region === scope.region) return "medium";
      return "low";
    });
    add({ type: "T7", subjectKey: s, subjectLabel: site.display, correct, display: muscleName, cands, multi: true, related: correct, preferCorrect: scopedIds });
  });
  // T8
  const boneSubjects = new Set(); scoped.forEach(m => m.boneKeys.forEach(b => boneSubjects.add(b)));
  boneSubjects.forEach(b => {
    const bone = ix.bones.get(b); if (!bone) return;
    const correct = [...bone.muscles]; const cm = correct.map(id => ix.byId[id]);
    const cands = classify(tested.filter(o => !bone.muscles.has(o.id)).map(o => o.id), id => {
      const o = ix.byId[id];
      if (cm.some(c => [...c.crossKeys].some(j => o.crossKeys.has(j)))) return "high";
      if (o.region === scope.region) return "medium";
      return "low";
    });
    add({ type: "T8", subjectKey: b, subjectLabel: bone.display, correct, display: muscleName, cands, multi: true, related: correct, preferCorrect: scopedIds });
  });
  const res = { variants, skipped, scoped };
  genCache.set(key, res);
  return res;
}

function promptHTML(v) {

function buildQuestion(v, r = rand) {

  else correct = shuffle(correct, r);
  const shown = correct.slice(0, v.shownCorrectCount);
  const wrong = [];
  v.plan.forEach(p => wrong.push(...sample(p.pool, p.take, r)));
  const opts = shown.map(k => ({ key: k, text: v.display(k), isCorrect: true })).concat(wrong.map(k => ({ key: k, text: v.display(k), isCorrect: false })));
  return { prompt: promptHTML(v), options: shuffle(opts, r), multi: v.multi, relatedShown: v.type === "T6" || v.type === "T7" || v.type === "T8" ? shown : v.relatedMuscleIds };
}

/* ================= SCORING ================= */
function tierFor(total) { return total <= 1 ? 1 : total === 2 ? 2 : total <= 4 ? 3 : total === 5 ? 4 : 5; }
function scoreVariant(v, ix) {
  const S = CONFIG.SCORE;
  const direction = ["T6","T7","T8"].includes(v.type) ? S.reverseDirection : 0;
  const specificity = ["T1","T2","T5","T6","T7"].includes(v.type) ? S.landmarkOrAction : 0;
  const similarity = S.similarity[v.actualSimilarity] || 0;
  const n = v.shownCorrectCount;
  const correctShown = n <= 1 ? S.correctShown.one : n <= 3 ? S.correctShown.twoToThree : S.correctShown.fourPlus;
  let adjust = 0;
  if (["T6","T7","T8"].includes(v.type)) adjust = Math.max(...v.correct.map(id => ix.byId[id] ? ix.byId[id].difficultyAdjust : 0));
  else if (v.subjectMuscleId) adjust = ix.byId[v.subjectMuscleId].difficultyAdjust;
  const total = Math.max(0, direction + specificity + similarity + correctShown + adjust);
  return { direction, specificity, similarity, correctShown, adjust, total, tier: tierFor(total) };
}

/* ================= STATE / ENGINE ================= */
function scopeKey(scope) { return scope.region + "|" + (scope.joints && scope.joints.length ? scope.joints.slice().sort().join(",") : "all"); }
function freshState() { return { version: 1, totalAnswered: 0, scopes: {}, variants: {}, prefs: { scope: { region: "upper", joints: [] } } }; }
function loadState() {
  try { const s = JSON.parse(store.get(CONFIG.STATE_KEY) || "null"); if (s && s.version === 1) { s.prefs = s.prefs || { scope: { region: "upper", joints: [] } }; return s; } } catch (e) {}
  return freshState();
}
function saveState(s) { store.set(CONFIG.STATE_KEY, JSON.stringify(s)); }
function scopeState(state, scope) {
  const k = scopeKey(scope);
  if (!state.scopes[k]) state.scopes[k] = { tier: 1, window: [], consecutiveMisses: 0 };
  return state.scopes[k];
}
function pickNext(variants, state, scope, recent, r = rand) {
  if (!variants.length) return null;
  const ss = scopeState(state, scope);
  const T = state.totalAnswered;
  const vs = id => state.variants[id];
  const notLast = v => v.baseId !== recent.lastBaseId;
  const avoidRecent = list => { const f = list.filter(v => !v.relatedMuscleIds.some(id => recent.recentMuscleIds.includes(id))); return f.length ? f : list; };
  // a. due missed items, any tier
  const missed = variants.filter(v => { const s = vs(v.variantId); return s && s.box === 0 && s.attempts > 0 && s.dueAt <= T && notLast(v); });
  if (missed.length) { missed.sort((a, b) => vs(a.variantId).dueAt - vs(b.variantId).dueAt); return missed[0]; }
  for (let guard = 0; guard < 6; guard++) {
    let tier = ss.tier;
    if (tier > 1 && r() < CONFIG.RETENTION_MIX) {
      const below = variants.filter(v => v.tier === tier - 1 && notLast(v) && (() => { const s = vs(v.variantId); return s && s.box < 3 && s.dueAt <= T; })());
      if (below.length) return pick(avoidRecent(below), r);
    }
    const atTier = variants.filter(v => v.tier === tier);
    if (atTier.length && atTier.every(v => { const s = vs(v.variantId); return s && s.box >= 3; }) && ss.tier < 5) { ss.tier++; ss.window = []; continue; }
    let pool = atTier.filter(notLast);
    if (!pool.length) {
      // nearest tier with variants, lower first
      for (let d = 1; d <= 4 && !pool.length; d++) {
        for (const t of [tier - d, tier + d]) { if (t >= 1 && t <= 5 && !pool.length) pool = variants.filter(v => v.tier === t && notLast(v)); }
      }
    }
    if (!pool.length) pool = variants.slice();
    const due = pool.filter(v => { const s = vs(v.variantId); return s && s.attempts > 0 && s.box < 3 && s.dueAt <= T; });
    if (due.length) return pick(avoidRecent(due), r);
    const unseen = pool.filter(v => !vs(v.variantId));
    if (unseen.length) return pick(avoidRecent(unseen), r);
    const notMastered = pool.filter(v => vs(v.variantId).box < 3);
    const src = notMastered.length ? notMastered : pool;
    const minBox = Math.min(...src.map(v => vs(v.variantId).box));
    const low = src.filter(v => vs(v.variantId).box === minBox);
    // among lowest box, prefer the one due soonest
    low.sort((a, b) => vs(a.variantId).dueAt - vs(b.variantId).dueAt);
    return avoidRecent(low.slice(0, Math.max(3, Math.ceil(low.length / 3))))[0] || low[0];
  }
  return pick(variants, r);
}
function recordAnswer(state, scope, v, isCorrect, r = rand) {
  state.totalAnswered += 1;
  const T = state.totalAnswered;
  const s = state.variants[v.variantId] || { box: 0, attempts: 0, correct: 0, lastSeenAt: 0, dueAt: 0 };
  s.attempts++; s.lastSeenAt = T;
  if (isCorrect) {
    s.correct++; s.box = Math.min(s.box + 1, 3);
    s.dueAt = s.box === 1 ? T + CONFIG.BOX1_DELAY : s.box === 2 ? T + CONFIG.BOX2_DELAY : Number.MAX_SAFE_INTEGER;
  } else {
    s.box = 0;
    s.dueAt = T + CONFIG.MISSED_DELAY_MIN + Math.floor(r() * (CONFIG.MISSED_DELAY_MAX - CONFIG.MISSED_DELAY_MIN + 1));
  }
  state.variants[v.variantId] = s;
  const ss = scopeState(state, scope);
  let tierChange = null;
  if (v.tier === ss.tier) {
    ss.window.push(!!isCorrect);
    if (ss.window.length > CONFIG.PROMOTE_WINDOW) ss.window = ss.window.slice(-CONFIG.PROMOTE_WINDOW);
  }
  ss.consecutiveMisses = isCorrect ? 0 : ss.consecutiveMisses + 1;
  if (ss.consecutiveMisses >= CONFIG.DEMOTE_CONSECUTIVE_MISSES) {
    if (ss.tier > 1) { ss.tier--; tierChange = "down"; }
    ss.window = []; ss.consecutiveMisses = 0;
  } else if (ss.window.length >= CONFIG.PROMOTE_WINDOW && ss.window.filter(Boolean).length >= CONFIG.PROMOTE_MIN_CORRECT) {
    if (ss.tier < 5) { ss.tier++; tierChange = "up"; }
    ss.window = [];
  }
  return { state, tierChange };
}
function computeMastery(ix, state) {
  const mastered = {};
  const all = [...generateVariants(ix, { region: "upper", joints: [] }).variants, ...generateVariants(ix, { region: "lower", joints: [] }).variants];
  const bases = {};
  all.forEach(v => { if (v.subjectMuscleId && ["T1","T2","T3","T4","T5","T9"].includes(v.type)) { (bases[v.subjectMuscleId] = bases[v.subjectMuscleId] || {}); (bases[v.subjectMuscleId][v.baseId] = bases[v.subjectMuscleId][v.baseId] || []).push(v.variantId); } });
  ix.muscles.forEach(m => {
    const b = bases[m.id] || {};
    const keys = Object.keys(b);
    mastered[m.id] = keys.length > 0 && keys.every(k => b[k].some(id => state.variants[id] && state.variants[id].box >= 3));
  });
  const joints = {}, regions = {};
  ix.cross.forEach((j, k) => { const ms = [...j.muscles]; joints[k] = Math.round(100 * ms.filter(id => mastered[id]).length / ms.length); });
  ["upper", "lower"].forEach(r => { const ms = ix.muscles.filter(m => m.region === r); regions[r] = { pct: ms.length ? Math.round(100 * ms.filter(m => mastered[m.id]).length / ms.length) : 0, done: ms.filter(m => mastered[m.id]).length, total: ms.length }; });
  return { muscles: mastered, joints, regions };
}

}

    el.closest(".opt").classList.toggle("sel", el.checked);
    const b = document.querySelector('[data-act="submit"]'); if (b) b.disabled = !c.selected.size;
  } else if (el.dataset.act === "bshuffle") { app.browse.shuffle = el.checked; app.browse.idx = 0; app.browse.order = null; app.browse.flipped = false; renderBrowse(route().params); }
  else if (el.dataset.rv) {
    const rv = app.review;
    if (el.dataset.rv === "region") rv.scope = { region: el.value, joints: [] };
    else if (el.dataset.rv === "joint") rv.scope = { region: rv.scope.region, joints: el.checked ? rv.scope.joints.concat(el.value) : rv.scope.joints.filter(j => j !== el.value) };
    else if (el.dataset.rv === "tier") rv.tier = el.value;
    else if (el.dataset.rv === "type") rv.type = el.value;
    rv.preview = null; renderReview();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "bsearch") { app.browse.q = e.target.value; renderSearchResults(); }
  if (e.target.dataset.rv === "q") { app.review.q = e.target.value; clearTimeout(app._rvT); app._rvT = setTimeout(() => { const pos = e.target.selectionStart; renderReview(); const i = document.querySelector('[data-rv="q"]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }, 350); }
});
document.addEventListener("keydown", e => {
  if (route().path !== "/browse" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") browseMove(-1);
  if (e.key === "ArrowRight") browseMove(1);
});
let tx = null, ty = null;
document.addEventListener("touchstart", e => { if (route().path === "/browse" && e.target.closest(".flip")) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } else tx = null; }, { passive: true });
document.addEventListener("touchend", e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { e.preventDefault(); browseMove(dx < 0 ? 1 : -1); }
});

async function init() {
  app.status = "loading"; render();
  try {
    const res = await loadData();
    app.data = res.data; app.source = res.source; app.ix = buildIndex(res.data.muscles); genCache.clear();
    app.status = "ready";
  } catch (e) { console.error(e); app.status = "error"; }
  lastPath = route().path; render();
}
window.OIA = { CONFIG, parseMuscleCsv, buildIndex, generateVariants, buildQuestion, scoreVariant, pickNext, recordAnswer, computeMastery, freshState, scopeKey, app, locLevel };
init();
</script>
